<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    /* thème avant le 1er rendu + classe .js */
    (function (h) {
        h.classList.add('js');
        try {
            var t = localStorage.getItem('theme');
            if (!t && window.matchMedia) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            if (t) h.setAttribute('data-theme', t);
        } catch (e) {}
    })(document.documentElement);
    </script>
    <title>404 — Pièce manquante | Shabdpreet Singh</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Page introuvable — portfolio de Shabdpreet Singh, étudiant BTS SIO SISR en alternance chez ALLIANC3.">
    <link rel="icon" type="image/svg+xml" href="/Mon-Portfolio/favicon.svg">
    <meta name="theme-color" content="#D42B1E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Mon-Portfolio/style.css">
    <style>
        .err-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .err-panel {
            position: relative;
            background: var(--panel-bg);
            border: 1.5px solid var(--panel-line);
            padding: 2rem 2rem 1.8rem;
            max-width: 480px;
            width: 100%;
            font-family: var(--mono);
            color: var(--panel-text);
            box-shadow: 8px 8px 0 var(--red);
        }
        .err-panel .head {
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            padding-bottom: 0.8rem; margin-bottom: 1rem;
            border-bottom: 1.5px solid var(--panel-line);
            font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--panel-soft);
        }
        .err-panel .code {
            font-family: var(--display);
            font-size: 6rem; font-weight: 800; color: #fff; line-height: 0.9; margin: 0.4rem 0 0.8rem;
            letter-spacing: -0.02em;
        }
        .err-panel .code .x { color: transparent; -webkit-text-stroke: 2px var(--red); }
        .err-tag {
            display: inline-block;
            font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--red); border: 1.5px solid var(--red);
            padding: 0.35rem 0.5rem 0.28rem; line-height: 1; margin-bottom: 1rem;
        }
        .err-line { color: var(--panel-soft); font-size: 0.84rem; margin: 0.3rem 0; }
        .err-line .prompt { color: var(--red); font-weight: 600; margin-right: 0.5rem; }
        .err-panel .btn { margin-top: 1.4rem; width: 100%; }
        .err-wrap { padding-top: 11rem; }
        .pl-lost {
            position: absolute;
            right: 28px;
            bottom: calc(100% - 1px);
            width: 112px;
            z-index: 2;
            --pl-sh: 4px;
            --say-r: 96%;
            --say-b: 70%;
        }
        .err-led {
            width: 8px; height: 8px; background: var(--warn);
            display: inline-block; margin-right: 0.45rem; vertical-align: 0;
            animation: led-blink 1.2s steps(1) infinite;
        }
    </style>

    <meta property="og:image" content="https://shab14.github.io/Mon-Portfolio/fichiers/og-image.png">
    <meta property="og:url" content="https://shab14.github.io/Mon-Portfolio/404.html">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://shab14.github.io/Mon-Portfolio/fichiers/og-image.png">
    <meta name="twitter:title" content="Shabdpreet Singh | Portfolio">
    <meta name="twitter:description" content="BTS SIO SISR en alternance chez ALLIANC3 — supervision, réseaux, infrastructure.">
    <link rel="manifest" href="/Mon-Portfolio/site.webmanifest">
</head>
<body>
    <div class="err-wrap">
        <div class="err-panel">
            <div class="pl-lost" data-pilote="lost" aria-hidden="true"></div>
            <div class="head">
                <span><span class="err-led"></span>Notice — pièce manquante</span>
                <span>HTTP 404</span>
            </div>
            <div class="code">4<span class="x">0</span>4</div>
            <span class="err-tag">Runner introuvable</span>
            <p class="err-line"><span class="prompt">$</span>curl page-demandée</p>
            <p class="err-line"><span class="warn2">&gt; statut : NOT FOUND</span></p>
            <p class="err-line">Cette pièce n'est pas sur la grappe — ou elle a bougé sans prévenir le DNS.</p>
            <p class="err-line"><span class="ok2">&gt; reste du kit : OK</span></p>
            <a href="/Mon-Portfolio/" class="btn btn-primary">Retour à l'accueil</a>
        </div>
    </div>
    <script src="/Mon-Portfolio/pilote.js"></script>
</body>
</html>
